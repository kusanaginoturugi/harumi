[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harumi"
version = "0.1.0"
description = "Local-first file indexing assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "markitdown>=0.1.0",
]

[project.scripts]
harumi = "harumi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
